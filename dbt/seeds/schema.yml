version: 2

seeds:
  - name: city_canonical
    description: |
      Lookup from lowercased raw city → canonical display name + 2-letter
      state code. Source: distinct city values present in the v1 input
      CSV. New cities surfaced by future inputs land in `_quality_flags`
      as `unknown_city` (see `stg_restaurants__flagged`).
    columns:
      - name: raw
        tests:
          - not_null
          - unique
      - name: canonical
        tests:
          - not_null
      - name: state_code
        tests:
          - not_null

  - name: price_point_mapping
    description: |
      Lookup from raw price_point string → canonical {low,medium,high}
      or NULL. Empty `canonical` means "drop the value, flag the row".
    columns:
      - name: raw
        tests:
          - not_null
          - unique

  - name: place_id_prefixes
    description: |
      Allowed Google Places ID prefixes. Used by `stg_restaurants` to
      reject obviously fabricated place_ids (random base64-looking strings
      that don't start with one of these).
    columns:
      - name: prefix
        tests:
          - not_null
          - unique

  - name: cuisine_taxonomy
    description: |
      Maps Google `primary_type` (after staging normalization) to a closed
      cuisine taxonomy. Generic types (`restaurant`, `fine_dining_restaurant`,
      `bistro`, `hotel`, `bar`, `cafe`, etc.) are intentionally absent →
      those rows escalate to the LLM in Stage 4b. The same closed set of
      cuisines is enforced on Gemini's structured output.
    columns:
      - name: primary_type
        tests:
          - not_null
          - unique
      - name: cuisine
        tests:
          - not_null

  - name: romance_rubric
    description: |
      Deterministic per-(primary_type, price_point) prior for the romance
      sub-scores. Rows that match get scores from this seed; rows that
      don't escalate to Gemini in Stage 4b. Sub-scores are 0–10 ints.
    columns:
      - name: primary_type
        tests:
          - not_null
      - name: price_point
        tests:
          - not_null
          - accepted_values:
              values: ["low", "medium", "high"]
              quote: true
